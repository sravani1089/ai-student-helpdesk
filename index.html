
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Helpdesk</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 25px;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        .panel {
            background: white;
            padding: 22px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000012;
        }

        input, textarea, button, select {
            font: inherit;
            padding: 11px;
            box-sizing: border-box;
        }

        input, textarea {
            width: 100%;
            margin: 7px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .stat {
            background: #eff6ff;
            padding: 18px 8px;
            text-align: center;
            border-radius: 10px;
        }

        .stat h3 {
            margin: 0 0 8px;
            font-size: 15px;
        }

        .stat p {
            font-size: 25px;
            font-weight: bold;
            margin: 0;
            color: #1d4ed8;
        }

        .issue-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>AI Student Helpdesk & Issue Tracker</h1>

        <div class="panel">
            <h2>Issue Dashboard</h2>

            <div class="dashboard">
                <div class="stat">
                    <h3>Total Issues</h3>
                    <p id="totalCount">0</p>
                </div>

                <div class="stat">
                    <h3>Open</h3>
                    <p id="openCount">0</p>
                </div>

                <div class="stat">
                    <h3>In Progress</h3>
                    <p id="progressCount">0</p>
                </div>

                <div class="stat">
                    <h3>Resolved</h3>
                    <p id="resolvedCount">0</p>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Submit a New Issue</h2>

            <form id="issueForm">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName"
                       placeholder="Enter your name" required>

                <label for="issueTitle">Issue Title:</label>
                <input type="text" id="issueTitle"
                       placeholder="Enter issue title" required>

                <label for="issueDescription">Describe Your Issue:</label>
                <textarea id="issueDescription"
                          placeholder="Explain your problem"
                          required></textarea>

                <button type="submit">Submit Issue</button>
            </form>
        </div>

        <div class="panel">
            <h2>My Submitted Issues</h2>
            <div id="issueList"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
